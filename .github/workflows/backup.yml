name: Supabase Backup to GitHub Releases

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create database dump
        run: |
          docker run --rm \
            -v "$PWD:/backup" \
            postgres:17 \
            pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file=/backup/backup.dump
          ls -lh backup.dump

      - name: Encrypt backup
        run: |
          echo "$BACKUP_PASSPHRASE" | gpg \
            --batch \
            --yes \
            --passphrase-fd 0 \
            --symmetric \
            --cipher-algo AES256 \
            --output backup.dump.gpg \
            backup.dump
          rm backup.dump
          ls -lh backup.dump.gpg

      - name: Publish encrypted release
        run: |
          TAG="backup-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" backup.dump.gpg \
            --title "Backup $TAG" \
            --notes "Backup cifrado de Supabase. Restaurar con gpg + pg_restore."

      - name: Delete backups older than 30 days
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '.[] | select((now - (.createdAt | fromdateiso8601)) > 2592000) | .tagName' |
          while read -r tag; do
            if [ -n "$tag" ]; then
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done
